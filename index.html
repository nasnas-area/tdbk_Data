<title>東京ディバンカー SSRカードチェッカー</title>

<style>
:root{--bg:#0d0c14;--panel:#171524;--line:#2b2840;--text:#e9e6f2;--sub:#9a96b3;--gold:#d9b66a;--gold-d:#3a3016;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#231d3d 0,transparent 60%),var(--bg);color:var(--text);

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:clamp(24px,5vw,38px);margin:4px 0 2px;letter-spacing:.06em;font-weight:700}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.badge span{font-size:12px;color:var(--sub)}
.badge.main{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;border-color:var(--gold);background:linear-gradient(160deg,var(--gold-d),var(--panel))}
.badge.main b{color:var(--gold)}
.bar{height:6px;background:var(--line);border-radius:4px;margin:12px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d2c,var(--gold));transition:width .35s}
.ctrl{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:12px;color:var(--sub);min-width:56px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.tab{background:transparent;border:0;padding:8px 16px;color:var(--sub)}
.tab[aria-pressed=true]{background:var(--gold);color:#1b1608;font-weight:700}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--sub)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--c,var(--gold));box-shadow:inset 0 0 0 1px var(--c,var(--gold))}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{transform:translateY(-2px)}
.card .art{position:relative;aspect-ratio:3/4;background-size:cover;background-position:center;filter:grayscale(.85) brightness(.6);transition:filter .3s}
.card.own{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 24px -10px rgba(217,182,106,.45)}
.card.own .art{filter:none}
.at{position:absolute;left:8px;top:8px;z-index:1;min-width:30px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);padding:0 7px;border-radius:5px;background:rgba(13,12,20,.88);border:1px solid var(--gold)}
.art::after{content:"";position:absolute;inset:6px;border:1px solid rgba(217,182,106,.6);border-radius:7px;pointer-events:none}
.tick{z-index:1}
.rel{font-size:11px;color:var(--sub);margin-top:4px}
.chk{font-size:10px;color:var(--sub);border:1px dashed #5a5578;border-radius:4px;padding:0 5px;align-self:flex-start;margin-top:4px}
.tick{position:absolute;right:8px;top:8px;height:24px;padding:0 9px;border-radius:999px;background:var(--gold);color:#1b1608;display:none;align-items:center;font-weight:700;font-size:12px}
.card.own .tick{display:flex}
.info{padding:10px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.name{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;line-height:1.35}
.who{font-size:12px;color:var(--sub)}
.dorm{font-size:11px;display:inline-block;margin-top:2px;padding:1px 8px;border-radius:4px;border:1px solid var(--c);color:var(--c);align-self:flex-start}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:11px;color:var(--sub)}
.st b{display:block;color:var(--text);font-size:13px}
.attr{font-size:11px;color:var(--sub);margin-top:4px}
.card.max{box-shadow:0 0 0 1px var(--gold),0 0 28px -4px rgba(217,182,106,.65)}
.stars{display:flex;gap:3px;margin-top:8px}
.star{flex:1;border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 0;font-size:15px;line-height:1;color:#4a4663}
.star.on{color:var(--gold);background:var(--gold-d);border-color:#6b5a2a}
.lvl{font-size:12px;color:var(--sub);margin-top:5px;text-align:center}
.card.own .lvl{color:var(--gold)}.card.max .lvl{font-weight:700}
.sel{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;max-width:100%}
.sel:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{cursor:pointer}
.meta{font-size:12px;color:var(--sub);margin-top:3px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .2s ease}
.modal{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1.15)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
